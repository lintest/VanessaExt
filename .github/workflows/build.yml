name: build

# Основная сборка VanessaExt: Linux-компонента в контейнере ubuntu:18.04,
# Windows-компонента на MSVC, внешняя обработка .epf, GUI-автотест в тонком
# клиенте 1С и черновик релиза на master.
#
# AppVeyor (appveyor.yml) остаётся резервным контуром: на хостинговом
# windows-раннере GitHub нет гарантированной интерактивной сессии, а клиенту 1С
# нужно окно. Если автотест здесь перестанет запускаться — GUI-проверку
# вытягивает AppVeyor.
on:
  push:
    # Ветка actions — только на время переезда, перед мержем в develop убрать.
    branches: [develop, master, actions]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: VanessaExt

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Версия = база из VERSION + номер прогона, как 1.3.9.{build} в AppVeyor.
      - name: Версия сборки
        id: version
        run: |
          set -e
          base=$(tr -d ' \r\n' < VERSION)
          if [ -z "$base" ]; then
            echo "::error::файл VERSION пуст"
            exit 1
          fi
          version="$base.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::версия сборки $version"

      # Зависимости внутри контейнера собираются из исходников (OpenCV 4.5.2
      # под две разрядности, Boost b2, RE-flex). Каталоги лежат в workspace,
      # который монтируется в контейнер, поэтому их можно кэшировать между
      # прогонами: скрипт сборки пропускает уже готовые шаги.
      - name: Кэш зависимостей
        uses: actions/cache@v4
        with:
          path: |
            opencv-x32
            opencv-x64
            opencv-4.5.2/3rdparty
            boost_1_92_0/boost
            boost_1_92_0/stage/lib
            RE-flex
          key: lin-deps-ocv452-boost192-reflex301-${{ hashFiles('Build.OpenCV.sh') }}

      # ubuntu:18.04 + gcc-7 — это и есть ABI-базовая линия артефакта
      # (glibc 2.27 / GLIBCXX 3.4.25). Менять образ нельзя: на более свежем
      # окружении .so потребует GLIBC_2.28+ и не загрузится на 18.04/20.04.
      - name: Сборка Linux-компоненты
        run: |
          set -e
          docker run --rm -v "$PWD:/src" -w /src \
            -e BUILD_VERSION="${{ steps.version.outputs.version }}" \
            ubuntu:18.04 bash -c "bash /src/scripts/ci-linux-build.sh"

      - name: Проверка ABI-базовой линии
        run: |
          python3 tools/check_abi_baseline.py \
            ./bin32/${PROJECT_NAME}Lin32.so ./bin64/${PROJECT_NAME}Lin64.so

      # Заголовки, которые нужны при конфигурировании и сборке тестов:
      # include/com.h (через types.h и stdafx.h) требует uuid/uuid.h, а
      # X11/XTest/XRandR линкуются в основной таргет безусловно — без пакетов
      # target_link_libraries падает на пустых переменных. В контейнере
      # ubuntu:18.04 всё это ставит ci-linux-build.sh, на раннере — здесь.
      - name: Системные пакеты для сборки тестов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            uuid-dev libpng-dev zlib1g-dev \
            libx11-dev libxtst-dev libxrandr-dev

      # Юнит-тесты ядра процессов. OpenCV/Boost/libgit2 не нужны, поэтому идут
      # секунды, см. Docs/BuildLibrary.md.
      - name: Юнит-тесты C++
        continue-on-error: true
        run: |
          set -e
          cmake --version
          cmake -S . -B build-tests \
            -DWITH_GHERKIN=OFF -DWITH_OPENCV=OFF -DWITH_BOOST=OFF \
            -DWITH_LIBGIT2=OFF -DVANESSAEXT_BUILD_TESTS=ON || {
              echo "::error::конфигурирование CMake упало"
              cat build-tests/CMakeFiles/CMakeError.log 2>/dev/null || true
              tail -n 50 build-tests/CMakeFiles/CMakeOutput.log 2>/dev/null || true
              exit 1
            }
          cmake --build build-tests --target ProcessUtilsTest
          ctest --test-dir build-tests --output-on-failure

      # .debug появляются только если в контейнере был eu-strip (elfutils),
      # поэтому пакуем по факту наличия — как в appveyor.yml.
      - name: Упаковка Linux-артефакта
        run: |
          set -e
          rm -f AddIn.zip
          packed=0
          for f in ./bin32/*Lin32.so ./bin64/*Lin64.so \
                   ./bin32/*Lin32.so.debug ./bin64/*Lin64.so.debug; do
            if [ -f "$f" ]; then
              zip -q -X -j AddIn.zip "$f"
              echo "в архиве: $f"
              packed=$((packed + 1))
            else
              echo "пропускаю (нет файла): $f"
            fi
          done
          if [ "$packed" -lt 2 ]; then
            echo "::error::в архиве меньше двух библиотек"
            exit 1
          fi
          unzip -l AddIn.zip

      - name: Выгрузка Linux-артефакта
        uses: actions/upload-artifact@v4
        with:
          name: linux-addin
          path: AddIn.zip

  # Прогон автотестов компоненты в настоящем клиенте 1С под Linux.
  # Отдельный job, потому что нужен другой образ (webkitgtk 4.0 есть только
  # до 22.04) и своя тяжёлая инфраструктура: Xvfb с WM, платформа 1С, база.
  linux-test:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Забрать Linux-артефакт
        uses: actions/download-artifact@v4
        with:
          name: linux-addin
          path: linux-addin

      - name: Resolve platform branch
        id: platform
        run: |
          set -e
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          sha=$(git ls-remote https://github.com/lintest/tools1c.git refs/heads/platform-linux | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::не удалось получить SHA ветки platform-linux"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Архив платформы — это несколько гигабайт томов; качаем один раз на
      # версию ветки, дальше берём из кэша.
      - name: Кэш платформы
        id: platform-cache
        uses: actions/cache@v4
        with:
          path: ~/1c/dist
          key: p1c-linux-${{ steps.platform.outputs.sha }}

      - name: Автотесты в клиенте 1С
        env:
          KEY_1CV8T: ${{ secrets.KEY_1CV8T }}
          ADDIN_ZIP: ${{ github.workspace }}/linux-addin/AddIn.zip
        run: bash scripts/ci-linux-test.sh

      - name: Выгрузка артефактов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-autotest
          if-no-files-found: warn
          path: |
            tests-report.json
            tests-report.log
            autotest.log
            autotest.out
            example.log
            stub.log
            success.txt

  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Забрать Linux-артефакт
        uses: actions/download-artifact@v4
        with:
          name: linux-addin
          path: linux-addin

      # manifest.ps1 пишет version.h (его читает компилятор) и manifest.xml
      # (его пакует ci-pack-windows.ps1). Параметры у скрипта уже есть.
      - name: version.h и manifest.xml
        shell: cmd
        run: powershell -File manifest.ps1 -project %PROJECT_NAME% -version ${{ needs.linux.outputs.version }}

      # Не-GUI проверка кода: тест ядра процессов собирается без X11/OpenCV/
      # Boost/libgit2. Идёт до тяжёлых сборок, чтобы падать быстро.
      # -C Release обязателен: на MSVC генератор многоконфигурационный.
      - name: Юнит-тесты C++
        continue-on-error: true
        shell: cmd
        run: |
          cmake -S . -B build-tests -DWITH_GHERKIN=OFF -DWITH_OPENCV=OFF -DWITH_BOOST=OFF -DWITH_LIBGIT2=OFF -DVANESSAEXT_BUILD_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build build-tests --target ProcessUtilsTest --config Release
          if errorlevel 1 exit /b 1
          ctest --test-dir build-tests -C Release --output-on-failure
          if errorlevel 1 exit /b 1

      # Собранные зависимости кэшируются целиком: Boost (заголовки + stage/lib
      # под обе разрядности), установленные деревья OpenCV, исходники
      # libgit2/libssh2 и RE-flex вместе с собранным reflex.exe. Ключ меняется
      # только вместе с версиями зависимостей или с Build.OpenCV.bat, поэтому
      # при обычной правке кода все шаги сборки зависимостей пропускаются.
      - name: Кэш зависимостей
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            opencv-x32
            opencv-x64
            boost_1_92_0/boost
            boost_1_92_0/stage/lib
            libgit2-1.1.0
            libssh2-1.9.0
            RE-flex
          key: win-deps-v3-ocv452-boost192-git2110-reflex301-${{ hashFiles('Build.OpenCV.bat') }}

      # Платформа 1С — это гигабайты томов, а меняется редко: кэшируем по SHA
      # ветки platform, как на Linux.
      - name: SHA ветки platform
        id: platform
        shell: bash
        run: |
          set -e
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          sha=$(git ls-remote https://github.com/lintest/tools1c.git refs/heads/platform-8.3.27 | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::не удалось получить SHA ветки platform-8.3.27"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Кэш платформы 1С
        id: platform-cache
        uses: actions/cache@v4
        with:
          path: bin
          key: p1c-win-8.3.27-${{ steps.platform.outputs.sha }}

      # Токен checkout-а привязан к текущему репозиторию: с ним обращения к
      # чужим публичным репозиториям отваливаются, поэтому extraheader снимаем.
      # Раскладка как в VAEditor: клон ветки, распаковка томов win1c.7z.001..,
      # поиск каталога с 1cv8t.exe (учебная поставка) или 1cv8.exe (полная),
      # копирование в bin и алиасы имён, которых ждут последующие шаги.
      # Архив бывает как без пароля, так и под ним — пробуем оба варианта.
      - name: Платформа 1С
        if: steps.platform-cache.outputs.cache-hit != 'true'
        shell: cmd
        env:
          KEY_1CV8T: ${{ secrets.KEY_1CV8T }}
        run: |
          git config --local --unset-all "http.https://github.com/.extraheader"
          if exist p1c-src rmdir /s /q p1c-src
          if exist p1c rmdir /s /q p1c
          if exist bin rmdir /s /q bin
          git clone -q --branch=platform-8.3.27 https://github.com/lintest/tools1c.git p1c-src
          if errorlevel 1 exit /b 1
          mkdir p1c
          "%ProgramFiles%\7-Zip\7z.exe" x p1c-src\win1c.7z.001 -op1c
          if not errorlevel 1 goto extracted
          echo архив под паролем, пробую KEY_1CV8T
          "%ProgramFiles%\7-Zip\7z.exe" x p1c-src\win1c.7z.001 -p%KEY_1CV8T% -op1c
          if errorlevel 1 exit /b 1
          :extracted
          set "EXEDIR="
          for /f "delims=" %%F in ('dir /s /b p1c\1cv8t.exe 2^>nul') do set "EXEDIR=%%~dpF"
          if not defined EXEDIR for /f "delims=" %%F in ('dir /s /b p1c\1cv8.exe 2^>nul') do set "EXEDIR=%%~dpF"
          if not defined EXEDIR echo ERROR: платформа не найдена в архиве
          if not defined EXEDIR exit /b 1
          mkdir bin
          xcopy "%EXEDIR%\*" bin\ /E /I /Y /Q > nul
          if exist bin\1cv8.exe if not exist bin\1cv8t.exe copy /y bin\1cv8.exe bin\1cv8t.exe > nul
          if exist bin\1cv8c.exe if not exist bin\1cv8ct.exe copy /y bin\1cv8c.exe bin\1cv8ct.exe > nul
          rmdir /s /q p1c-src p1c

      # Проверка обязательна и при попадании в кэш: битый кэш не должен
      # доехать до шагов конфигурации.
      - name: Проверка платформы 1С
        shell: cmd
        run: dir /b bin\1cv8*.exe

      # RE-flex в репозитории — gitlink без .gitmodules, после checkout это
      # пустая папка. CMakeLists.txt ждёт RE-flex/bin/win64/reflex.exe, а в
      # ветке master форка готовый бинарник уже лежит. Собирать его MinGW-ом
      # не нужно и опасно: build.sh падает на posix_memalign (в mingw-w64 он
      # объявлен только при _POSIX_C_SOURCE). Исходники lib/ и unicode/ из
      # этого же клона всё равно компилируются в составе нашей цели.
      - name: RE-flex
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          if [ ! -f RE-flex/bin/win64/reflex.exe ]; then
            rm -rf RE-flex
            git clone -q --branch=master --depth=1 https://github.com/lintest/RE-flex.git RE-flex
          fi
          ls -la RE-flex/bin/win64
          test -f RE-flex/bin/win64/reflex.exe

      - name: OpenCV 4.5.2
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git clone -q --branch=4.5.2 --depth=1 https://github.com/opencv/opencv.git opencv-4.5.2
          if errorlevel 1 exit /b 1
          call Build.OpenCV.bat
          if errorlevel 1 exit /b 1

      # В appveyor.yml b2 запускался без address-model, то есть собирал только
      # 32-битные библиотеки — для x64-линковки этого мало. Здесь оба прогона.
      # Boost 1.92, а не 1.84: старый bootstrap.bat знает toolset'ы только до
      # vc143 и на раннере с Visual Studio 18 падает с "Unknown toolset: vcunk".
      # В 1.92 добавлено определение VS180COMNTOOLS (vc145).
      - name: Boost 1.92
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -sSfL -o boost_1_92_0.tar.gz https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
          if errorlevel 1 exit /b 1
          tar xzf boost_1_92_0.tar.gz
          cd boost_1_92_0
          call bootstrap.bat
          if errorlevel 1 exit /b 1
          .\b2.exe toolset=msvc link=static threading=multi runtime-link=static release stage --with-regex --with-date_time --with-filesystem address-model=32
          if errorlevel 1 exit /b 1
          .\b2.exe toolset=msvc link=static threading=multi runtime-link=static release stage --with-regex --with-date_time --with-filesystem address-model=64
          if errorlevel 1 exit /b 1

      - name: libgit2 и libssh2
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git clone -q --branch=main https://github.com/libgit2/libgit2.git libgit2-1.1.0
          if errorlevel 1 exit /b 1
          cd libgit2-1.1.0
          git checkout -q -b version v1.1.0
          cd ..
          git clone -q --branch=master https://github.com/libssh2/libssh2.git libssh2-1.9.0
          if errorlevel 1 exit /b 1
          cd libssh2-1.9.0
          git checkout -q -b version libssh2-1.9.0
          cd ..

      - name: Сборка Win32
        shell: cmd
        run: |
          mkdir build32
          cd build32
          cmake .. -A Win32 -DMySuffix2=32
          if errorlevel 1 exit /b 1
          cmake --build . --config Release
          if errorlevel 1 exit /b 1

      - name: Сборка Win64
        shell: cmd
        run: |
          mkdir build64
          cd build64
          cmake .. -A x64 -DMySuffix2=64
          if errorlevel 1 exit /b 1
          cmake --build . --config Release
          if errorlevel 1 exit /b 1

      - name: Упаковка AddIn.zip и Debug.zip
        shell: pwsh
        run: ./scripts/ci-pack-windows.ps1 -project $env:PROJECT_NAME -version "${{ needs.linux.outputs.version }}"

      - name: Конфигурация и внешняя обработка
        shell: cmd
        run: |
          mkdir database
          bin\1cv8t.exe CREATEINFOBASE File=%CD%/database
          if errorlevel 1 exit /b 1
          bin\1cv8t.exe DESIGNER /F %CD%/database /LoadConfigFromFiles %CD%/Config /UpdateDBCfg
          if errorlevel 1 exit /b 1
          bin\1cv8t.exe DESIGNER /F %CD%/database /LoadExternalDataProcessorOrReportFromFiles Example.xml %PROJECT_NAME%.epf /Out example.log
          if errorlevel 1 exit /b 1
          dir /b %PROJECT_NAME%.epf

      # Форма Example/Forms/AppVeyor при открытии читает app_port.txt и шлёт
      # результаты в API AppVeyor. На раннере GitHub API нет — поднимаем
      # локальный приёмник и отдаём его порт через тот же файл. Код 1С не меняем.
      - name: Приёмник результатов тестов
        shell: pwsh
        run: |
          $stub = Start-Process python -ArgumentList 'scripts/ci-appveyor-stub.py' -PassThru `
            -RedirectStandardOutput 'stub.log' -RedirectStandardError 'stub.err'
          $stub.Id | Set-Content 'stub.pid'
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path 'app_port.txt') { break }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path 'app_port.txt')) {
            Get-Content 'stub.err' -ErrorAction SilentlyContinue
            throw 'приёмник результатов не поднялся'
          }
          Write-Host "приёмник слушает порт $(Get-Content app_port.txt)"

      # Два прогона сохранены для паритета с AppVeyor (/C install и /C autotest).
      # Форма параметр запуска не различает, поэтому прогоны идентичны; после
      # стабилизации первый можно убрать.
      #
      # continue-on-error — временно, на время переезда: на хостинговом
      # windows-раннере нет гарантированной интерактивной сессии, а клиенту 1С
      # нужно окно. Шаг нужен, чтобы увидеть факт (стартовал ли клиент, сколько
      # тестов прошло), не крася билд. После подтверждения — снять флаг.
      # Релиз при этом всё равно не публикуется: см. условие по outcome ниже.
      - name: Автотест 1С
        id: autotest
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 25
        run: |
          $exe = Join-Path $PWD 'bin\1cv8ct.exe'
          $base = Join-Path $PWD 'database'
          $epf = Join-Path $PWD "$env:PROJECT_NAME.epf"

          foreach ($mode in @('install', 'autotest')) {
            Remove-Item 'success.txt' -Force -ErrorAction SilentlyContinue
            Write-Host "== прогон /C $mode"
            $client = Start-Process -FilePath $exe -PassThru `
              -ArgumentList @('ENTERPRISE', '/LRU', '/F', $base, '/Execute', $epf, '/C', $mode) `
              -RedirectStandardOutput "autotest-$mode.log" -RedirectStandardError "autotest-$mode.err.log"
            if (-not $client.WaitForExit(600000)) {
              $client.Kill()
              throw "клиент 1С не завершился за 10 минут (/C $mode)"
            }
            Write-Host "код возврата клиента: $($client.ExitCode)"
            if (-not (Test-Path 'success.txt')) {
              Write-Host '--- отчёт приёмника ---'
              Get-Content 'tests-report.log' -ErrorAction SilentlyContinue
              Write-Host '--- вывод клиента ---'
              Get-Content "autotest-$mode.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
              throw "Имеются ошибки: success.txt не создан (/C $mode)"
            }
          }
          Write-Host 'автотест пройден'

      - name: Остановить приёмник
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'stub.pid') {
            Stop-Process -Id (Get-Content 'stub.pid') -Force -ErrorAction SilentlyContinue
            Remove-Item 'stub.pid' -Force -ErrorAction SilentlyContinue
          }
          Get-Content 'stub.log' -ErrorAction SilentlyContinue | Select-Object -Last 40
          Get-Content 'tests-report.log' -ErrorAction SilentlyContinue

      - name: Выгрузка артефактов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanessaext-${{ needs.linux.outputs.version }}
          if-no-files-found: warn
          path: |
            AddIn.zip
            Debug.zip
            ${{ env.PROJECT_NAME }}.epf
            tests-report.json
            tests-report.log
            stub.log
            autotest-install.log
            autotest-autotest.log
            example.log

      # outcome проверяется явно: шаг автотеста неблокирующий, поэтому success()
      # сам по себе не гарантирует, что тесты прошли.
      - name: Draft release
        if: github.ref == 'refs/heads/master' && success() && steps.autotest.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.linux.outputs.version }}
          tag_name: ${{ needs.linux.outputs.version }}
          draft: true
          prerelease: true
          files: |
            AddIn.zip
            Debug.zip
            ${{ env.PROJECT_NAME }}.epf

  # Контур OneScript: та же компонента, но без платформы 1С и без GUI.
  # Нужен только нативный мост ScriptEngine.NativeApi, поэтому прогон идёт
  # на обычном раннере. Подробности — tests/oscript/runner.os.
  # continue-on-error — временно, до первого зелёного прогона.
  oscript-linux:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Забрать Linux-артефакт
        uses: actions/download-artifact@v4
        with:
          name: linux-addin
          path: linux-addin

      # OneScript 2.2.0 — self-contained сборка под .NET 8: ни Mono, ни
      # отдельного dotnet не нужны. Ссылка собирается из фиксированной версии,
      # а не из ответа API: при исчерпанном лимите он отдаёт объект без поля
      # assets, отсюда был KeyError 'assets'.
      - name: Установка OneScript
        env:
          ONESCRIPT_VERSION: 2.2.0
        run: |
          set -e
          url="https://github.com/EvilBeaver/OneScript/releases/download/v${ONESCRIPT_VERSION}/OneScript-${ONESCRIPT_VERSION}-linux-x64.zip"
          echo "asset: $url"
          curl -sSfL -o oscript.zip "$url"
          mkdir -p oscript
          unzip -q oscript.zip -d oscript
          bin=$(find oscript -maxdepth 3 -name oscript -type f | head -n 1)
          [ -n "$bin" ] || { echo "::error::oscript не найден в архиве"; exit 1; }
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" --version

      # Диагностика NativeApi: печатает тип и содержимое того, что вернула
      # компонента. Нужна, пока строки JSON приходят пустыми.
      - name: Диагностика NativeApi
        continue-on-error: true
        run: |
          set -e
          unzip -o -q linux-addin/AddIn.zip -d libs
          oscript tests/oscript/probe.os --библиотека="$(ls libs/*Lin64.so | head -n 1)"

      - name: Прогон автотестов
        continue-on-error: true
        run: |
          set -e
          unzip -o -q linux-addin/AddIn.zip -d libs
          ls -la libs
          oscript tests/oscript/runner.os --библиотека="$(ls libs/*Lin64.so | head -n 1)"

  oscript-windows:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Забрать артефакт сборки
        uses: actions/download-artifact@v4
        with:
          pattern: vanessaext-*
          path: artifacts

      # Та же версия, что на Linux: self-contained сборка под .NET 8.
      - name: Установка OneScript
        shell: pwsh
        env:
          ONESCRIPT_VERSION: 2.2.0
        run: |
          $url = "https://github.com/EvilBeaver/OneScript/releases/download/v$env:ONESCRIPT_VERSION/OneScript-$env:ONESCRIPT_VERSION-win-x64.zip"
          Write-Host "asset: $url"
          Invoke-WebRequest $url -OutFile oscript.zip
          Expand-Archive oscript.zip -DestinationPath oscript -Force
          $exe = Get-ChildItem oscript -Recurse -Filter oscript.exe | Select-Object -First 1
          if (-not $exe) { throw 'oscript.exe не найден в архиве' }
          $exe.DirectoryName | Out-File -Append $env:GITHUB_PATH
          & $exe.FullName --version

      - name: Диагностика NativeApi
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts -Recurse -Filter AddIn.zip | Select-Object -First 1
          if (-not $zip) { throw 'не найден AddIn.zip в артефактах' }
          Expand-Archive $zip.FullName -DestinationPath libs -Force
          $library = Get-ChildItem libs -Filter '*Win64.dll' | Select-Object -First 1
          if (-not $library) { throw 'не найден VanessaExtWin64.dll' }
          oscript tests/oscript/probe.os --библиотека=$($library.FullName)

      - name: Прогон автотестов
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts -Recurse -Filter AddIn.zip | Select-Object -First 1
          if (-not $zip) { throw 'не найден AddIn.zip в артефактах' }
          Expand-Archive $zip.FullName -DestinationPath libs -Force
          Get-ChildItem libs | Format-Table Name
          $library = Get-ChildItem libs -Filter '*Win64.dll' | Select-Object -First 1
          if (-not $library) { throw 'не найден VanessaExtWin64.dll' }
          oscript tests/oscript/runner.os --библиотека=$($library.FullName)
