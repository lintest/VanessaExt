version: 1.4.0.{build}
configuration: Release
platform: x64

branches:
  only:
    - develop
    - master
    - opencode

skip_branch_with_pr: true
skip_tags: true

environment:
  # Пароль от архивов с дистрибутивом 1С 8.3.27.2342
  # (lintest/tools1c, ветки platform-8.3.27 и platform-linux).
  KEY_1CV8_8_3_27:
    secure: 34Xb8rbciFBEMpxZ5r2QxlNQgQALR/QWv8f1tWy120rHShlHO92WnQ1Tqye/nng7

  matrix:
    # 1. Сборка Linux-библиотеки.
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
      job_name: Linux

    # 2. Сборка Windows-библиотеки и упаковка VanessaExt.epf (без тестов).
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2019
      job_depends_on: Linux
      job_name: Windows

    # 3. Интеграционные тесты на реальной 1С под Windows.
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2019
      job_depends_on: Windows
      job_name: WindowsTests

    # 4. Интеграционные тесты на реальной 1С под Linux (Xvfb).
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
      job_depends_on: Windows
      job_name: LinuxTests

install:
  # Windows: дистрибутив 1С и утилиты. На Linux cmd-строки пропускаются.
  - cmd: git clone -q --branch=platform-8.3.27 https://github.com/lintest/tools1c.git bin
  - cmd: cd bin
  - cmd: 7z x win1c.7z.001 -p%KEY_1CV8_8_3_27%
  - cmd: cd ..
  - cmd: powershell -Command "Write-Host ('1C Windows version ' + (Get-Item bin\1cv8t.exe).VersionInfo.ProductVersion)"

  # Linux: зависимости сборки.
  - sh: sudo add-apt-repository --remove "deb http://apt.postgresql.org/pub/repos/apt/ bionic-pgdg main"
  - sh: wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
  - sh: sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 62D54FD4003F6525
  - sh: sudo dpkg --add-architecture i386
  - sh: sudo apt -qq update
  - sh: sudo apt -qq -y install
      build-essential
      elfutils
      gcc-9 g++-9
      uuid-dev uuid-dev:i386
      libpcre3-dev:i386
      libx11-dev libx11-dev:i386
      libxtst-dev libxtst-dev:i386
      libxrandr-dev libxrandr-dev:i386
      libpng-dev libpng-dev:i386
      libssl-dev libssl-dev:i386
      g++-9-multilib gcc-9-multilib

  - sh: sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100 --slave /usr/bin/g++ g++ /usr/bin/g++-9
  - sh: sudo update-alternatives --set gcc "/usr/bin/gcc-9"
  - sh: gcc --version

  - cmd: git clone -q --branch=main https://github.com/libgit2/libgit2.git libgit2-1.1.0
  - cmd: cd libgit2-1.1.0
  - cmd: git checkout -b version v1.1.0
  - cmd: cd ..

  - cmd: git clone -q --branch=master https://github.com/libssh2/libssh2.git libssh2-1.9.0
  - cmd: cd libssh2-1.9.0
  - cmd: git checkout -b version libssh2-1.9.0
  - cmd: cd ..

  - git clone -q --branch=4.5.2 https://github.com/opencv/opencv.git opencv-4.5.2
  - cd opencv-4.5.2
  - git checkout -b version 4.5.2
  - cd ..

  - git clone -q --branch=master --depth=1 https://github.com/lintest/RE-flex.git RE-flex
  - cd RE-flex
  - git checkout -b version v3.0.1
  - sh: ./clean.sh
  - sh: ./build.sh
  - cd ..

  - cmd: Build.OpenCV.bat
  - sh: ./Build.OpenCV.sh

  - appveyor DownloadFile https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz
  - tar xzf boost_1_84_0.tar.gz
  - cd boost_1_84_0
  - sh: ./bootstrap.sh
  - cmd: bootstrap.bat
  - cmd: b2.exe toolset=msvc link=static threading=multi runtime-link=static release stage --with-regex --with-date_time --with-filesystem
  - cd ..

init:
  - cmd: cmake --version
  - cmd: msbuild /version
  - cmd: echo.

build_script:
  - sh: echo "#define VERSION_FULL " ${APPVEYOR_BUILD_VERSION} > "version.h"
  - cmd: powershell -File manifest.ps1

  - sh: cd boost_1_84_0
  - sh: ./b2 cxxflags="-fPIC -std=c++17" link=static threading=multi runtime-link=static release stage --with-regex --with-date_time --with-filesystem address-model=32
  - sh: cd ..
  - mkdir build32
  - cd build32
  - sh: cmake -D CMAKE_BUILD_TYPE:STRING=RelWithDebInfo -D TARGET_PLATFORM_32:BOOL=ON ..
  - sh: cmake --build . --config RelWithDebInfo
  - cmd: cmake .. -A Win32 -DMySuffix2=32
  - cmd: cmake --build . --config Release
  - cd ..

  - sh: cd boost_1_84_0
  - sh: ./b2 cxxflags="-fPIC -std=c++17" link=static threading=multi runtime-link=static release stage --with-regex --with-date_time --with-filesystem address-model=64
  - sh: cd ..
  - mkdir build64
  - cd build64
  - sh: cmake -D CMAKE_BUILD_TYPE:STRING=RelWithDebInfo -D TARGET_PLATFORM_32:BOOL=OFF ..
  - sh: cmake --build . --config RelWithDebInfo
  - cmd: cmake .. -A x64 -DMySuffix2=64
  - cmd: cmake --build . --config Release
  - cd ..

for:
  # ---------------------------------------------------------------------------
  # Linux: только сборка. AddIn.zip с .so забирает Windows-джоба.
  # ---------------------------------------------------------------------------
  - matrix:
      only:
        - job_name: Linux

    after_build:
      - 7z a AddIn.zip ./bin32/${APPVEYOR_PROJECT_NAME}Lin32.so
      - 7z a AddIn.zip ./bin64/${APPVEYOR_PROJECT_NAME}Lin64.so
      - 7z a AddIn.zip ./bin32/${APPVEYOR_PROJECT_NAME}Lin32.so.debug
      - 7z a AddIn.zip ./bin64/${APPVEYOR_PROJECT_NAME}Lin64.so.debug

    artifacts:
      - path: AddIn.zip

  # ---------------------------------------------------------------------------
  # Windows: сборка + упаковка AddIn.zip/Debug.zip/VanessaExt.epf. Без тестов.
  # ---------------------------------------------------------------------------
  - matrix:
      only:
        - job_name: Windows

    after_build:
      - 7z a keywords.zip keywords.json
      - ps: New-Item -ItemType Directory -Force -Path Example/Templates/Keywords/Ext | Out-Null
      - ps: Copy-Item -Path keywords.zip -Destination Example/Templates/Keywords/Ext/Template.bin
      - copy bin32\Release\%APPVEYOR_PROJECT_NAME%Win32.dll .
      - copy bin64\Release\%APPVEYOR_PROJECT_NAME%Win64.dll .
      # Скачивает Linux .so, переименовывает все бинарники, собирает AddIn.zip/Debug.zip
      # и кладёт AddIn.zip в шаблон обработки.
      - powershell -File appveyor.ps1
      - appveyor PushArtifact AddIn.zip

      # Собираем VanessaExt.epf — тестовые джобы забирают его как артефакт.
      - mkdir database
      - bin\1cv8t.exe CREATEINFOBASE File=%CD%/database /DisableStartupDialogs /DisableStartupMessages
      - bin\1cv8t.exe DESIGNER /F %CD%/database /LoadConfigFromFiles %CD%/Config /UpdateDBCfg /DisableStartupDialogs /DisableStartupMessages
      - bin\1cv8t.exe DESIGNER /F %CD%/database /LoadExternalDataProcessorOrReportFromFiles Example.xml %APPVEYOR_PROJECT_NAME%.epf /Out example.log /DisableStartupDialogs /DisableStartupMessages
      - appveyor PushArtifact %APPVEYOR_PROJECT_NAME%.epf

    artifacts:
      - path: ${APPVEYOR_PROJECT_NAME}.epf
      - path: AddIn.zip
      - path: Debug.zip
      - path: example.log

  # ---------------------------------------------------------------------------
  # WindowsTests: только тесты на реальной 1С. EPF скачивается из Windows-джобы.
  # ---------------------------------------------------------------------------
  - matrix:
      only:
        - job_name: WindowsTests

    install:
      - cmd: git clone -q --branch=platform-8.3.27 https://github.com/lintest/tools1c.git bin
      - cmd: cd bin
      - cmd: 7z x win1c.7z.001 -p%KEY_1CV8_8_3_27%
      - cmd: cd ..
      - cmd: powershell -Command "Write-Host ('1C Windows version ' + (Get-Item bin\1cv8t.exe).VersionInfo.ProductVersion)"

    build_script:
      - cmd: echo "Build skipped - tests only"

    test_script:
      - ps: ./scripts/download-artifact.ps1 -JobName Windows -ArtifactName AddIn.zip
      - ps: ./scripts/download-artifact.ps1 -JobName Windows -ArtifactName Debug.zip
      - ps: ./scripts/download-artifact.ps1 -JobName Windows -ArtifactName "$env:APPVEYOR_PROJECT_NAME.epf"
      - appveyor PushArtifact AddIn.zip
      - appveyor PushArtifact Debug.zip
      - appveyor PushArtifact %APPVEYOR_PROJECT_NAME%.epf

      # Порт локального API AppVeyor нужен обработке для отправки результатов тестов.
      - ps: Set-Content -Path app_port.txt -Value ([uri] $env:APPVEYOR_API_URL).Port

      # Отключаем защиту от опасных действий: иначе клиент показывает модальное
      # предупреждение «Предупреждение безопасности» при загрузке внешней обработки
      # и не завершается.
      # ITS: 1С:Облачная подсистема Фреш, 11.3.7 — DisableUnsafeActionProtection=.*
      # ITS: «Размещение данных 1С:Предприятия 8» — локальный conf.cfg лежит в bin\conf
      # каталога версии, а настройки могут жить в общем каталоге из ConfLocation.
      - ps: |
          $setting = 'DisableUnsafeActionProtection=.*'
          $enc = New-Object System.Text.UTF8Encoding($false)

          Write-Host '--- layout ---'
          Get-ChildItem $PWD -Filter '*.exe' | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }

          $targets = New-Object System.Collections.Generic.List[string]
          $targets.Add((Join-Path $PWD 'bin\conf\conf.cfg'))
          $targets.Add((Join-Path $PWD 'bin\bin\conf\conf.cfg'))

          # Если в локальном conf.cfg есть ConfLocation — пишем и в общий каталог.
          foreach ($t in @($targets)) {
            if (Test-Path $t) {
              $loc = Select-String -Path $t -Pattern '^\s*ConfLocation\s*=\s*(.+)$' |
                Select-Object -First 1
              if ($loc) {
                $dir = $loc.Matches[0].Groups[1].Value.Trim()
                $targets.Add((Join-Path $dir 'conf.cfg'))
              }
            }
          }
          $targets.Add('C:\Program Files\1cv8\conf\conf.cfg')

          foreach ($t in $targets) {
            $dir = Split-Path $t -Parent
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            # Если файл не заканчивается переводом строки, настройка приклеится
            # к предыдущей директиве (например, к ConfLocation=).
            $text = if (Test-Path $t) { [System.IO.File]::ReadAllText($t) } else { '' }
            if ($text.Length -gt 0 -and -not $text.EndsWith("`n")) {
              [System.IO.File]::AppendAllText($t, "`r`n", $enc)
            }
            [System.IO.File]::AppendAllText($t, "$setting`r`n", $enc)
            Write-Host "conf.cfg: $t"
            Get-Content $t | ForEach-Object { Write-Host "  $_" }
          }

      - mkdir database
      - bin\1cv8t.exe CREATEINFOBASE File=%CD%/database /DisableStartupDialogs /DisableStartupMessages
      - bin\1cv8t.exe DESIGNER /F %CD%/database /LoadConfigFromFiles %CD%/Config /UpdateDBCfg /DisableStartupDialogs /DisableStartupMessages

      # 1С в интерактивном режиме может открыть модальное окно и не завершиться.
      # Поэтому запускаем с таймаутом: при зависании снимаем экран и падаем с диагностикой.
      - ps: |
          function Invoke-1C([string]$Mode, [int]$TimeoutSec, [string[]]$Extra = @()) {
            $a = @('ENTERPRISE', '/LRU', "/F$PWD\database")
            if ($Mode -ne 'prepare') {
              $a += @('/Execute', "$PWD\$env:APPVEYOR_PROJECT_NAME.epf")
            }
            # /C должен идти последним: остаток командной строки 1С считает его значением.
            $a += @('/DisableStartupDialogs', '/DisableStartupMessages',
                    '/Out', "$PWD\$Mode.log") + $Extra + @('/C', $Mode)
            $p = Start-Process -FilePath 'bin\1cv8ct.exe' -ArgumentList $a -PassThru
            if (-not $p.WaitForExit($TimeoutSec * 1000)) {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $r = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $r.Width, $r.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($r.Location, [System.Drawing.Point]::Empty, $r.Size)
              $bmp.Save("$PWD\desktop-$Mode.png")
              $p.Kill()
              throw "1C /C $Mode не завершился за $TimeoutSec с — смотрите $Mode.log и desktop-$Mode.png"
            }
            if ($p.ExitCode -ne 0) {
              throw "1C /C $Mode завершился с кодом $($p.ExitCode) — смотрите $Mode.log"
            }
          }

          # Фаза 1: создаём пользователя CI с отключёнными предупреждениями
          # безопасности (внешняя обработка при этом не загружается).
          Invoke-1C 'prepare' 300

          # Фаза 2: install и autotest — под пользователем CI, без диалогов.
          Invoke-1C 'install' 300 @('/N', 'CI')
          Invoke-1C 'autotest' 1800 @('/N', 'CI')

      - ps: if (!(Test-Path success.txt)) { throw "Имеются ошибки" }

    on_failure:
      - ps: if (Test-Path prepare.log) { Get-Content prepare.log -Tail 100 }
      - ps: if (Test-Path autotest.log) { Get-Content autotest.log -Tail 200 }
      - ps: if (Test-Path install.log) { Get-Content install.log -Tail 200 }

    artifacts:
      - path: prepare.log
      - path: autotest.log
      - path: install.log
      - path: desktop-prepare.png
      - path: desktop-install.png
      - path: desktop-autotest.png
      - path: AddIn.zip
      - path: Debug.zip
      - path: ${APPVEYOR_PROJECT_NAME}.epf

    deploy:
      - provider: GitHub
        auth_token:
          secure: v7P89NQ2I5+WGNNdhpFrZEt6OCTPf8A8VSC5rttZMXh3DJ2fTChNEjZ1Wvm3kfBt
        repository: lintest/VanessaExt
        artifact: AddIn.zip, Debug.zip, VanessaExt.epf
        draft: true
        prerelease: true
        force_update: true
        on:
          branch: master

  # ---------------------------------------------------------------------------
  # LinuxTests: только тесты на реальной 1С под Xvfb. EPF из Windows-джобы.
  # ---------------------------------------------------------------------------
  - matrix:
      only:
        - job_name: LinuxTests

    install:
      - sh: sudo add-apt-repository --remove "deb http://apt.postgresql.org/pub/repos/apt/ bionic-pgdg main" || true
      - sh: wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
      - sh: sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 62D54FD4003F6525
      - sh: sudo apt-get update
      - sh: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y
          p7zip-full
          xvfb
          x11-utils
          openbox
          dbus-x11
          locales
          fonts-dejavu-core
          fonts-liberation
          libgtk-3-0
          libwebkit2gtk-4.0-37
          libxrender1
          libxi6
          libxtst6
          libxrandr2
          libxss1
          libnss3
          libasound2
          libcups2
          libglu1-mesa
          libgomp1
          libdbus-1-3
      - sh: sudo locale-gen ru_RU.UTF-8 en_US.UTF-8
      - sh: git clone -q --branch=platform-linux --depth=1 https://github.com/lintest/tools1c.git 1c-linux
      - sh: |
          if [ -z "$KEY_1CV8_8_3_27" ]; then
            echo "KEY_1CV8_8_3_27 is not set"
            exit 1
          fi
          ARCHIVE=$(ls 1c-linux/*.7z.001 2>/dev/null | head -n1)
          if [ -z "$ARCHIVE" ]; then
            echo "Linux 1C archive not found in lintest/tools1c@platform-linux"
            exit 1
          fi
          echo "Archive: $ARCHIVE"
          7z x "$ARCHIVE" -p"$KEY_1CV8_8_3_27" -o1c-dist
      - sh: |
          ARCHIVE=$(ls 1c-dist/*.tar.gz 2>/dev/null | head -n1)
          if [ -n "$ARCHIVE" ]; then
            echo "Unpacking $ARCHIVE"
            tar xzf "$ARCHIVE" -C 1c-dist
          fi
          find 1c-dist -maxdepth 2 -type f | head -n 20
      - sh: |
          SETUP=$(find 1c-dist -name 'setup-*.run' -type f | head -n1)
          if [ -z "$SETUP" ]; then
            echo "setup-*.run not found"
            exit 1
          fi
          chmod +x "$SETUP"
          sudo "$SETUP" --mode unattended --unattendedmodeui none
      - sh: find /opt/1cv8 -type f -name 1cv8 || true
      # Отключаем защиту от опасных действий: иначе клиент показывает модальное
      # предупреждение «Предупреждение безопасности» при загрузке внешней обработки
      # и не завершается.
      # ITS: 1С:Облачная подсистема Фреш, 11.3.7 — DisableUnsafeActionProtection=.*
      - sh: |
          sudo mkdir -p /opt/1cv8/conf
          echo "DisableUnsafeActionProtection=.*" | sudo tee -a /opt/1cv8/conf/conf.cfg
          for f in $(sudo find /opt/1cv8 -type f -path '*/bin/conf/conf.cfg' 2>/dev/null); do
            echo "DisableUnsafeActionProtection=.*" | sudo tee -a "$f"
          done
          sudo find /opt/1cv8 -name conf.cfg -type f -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;

    build_script:
      - sh: echo "Build skipped - tests only"

    test_script:
      - sh: |
          curl -sSf "https://ci.appveyor.com/api/projects/$APPVEYOR_ACCOUNT_NAME/$APPVEYOR_PROJECT_NAME/build/$APPVEYOR_BUILD_VERSION" -o build.json
          JOB=$(python3 -c "import json;d=json.load(open('build.json'));print(next(j['jobId'] for j in d['build']['jobs'] if j['name']=='Windows'))")
          echo "Windows job: $JOB"
          curl -sSfL -o "$APPVEYOR_PROJECT_NAME.epf" "https://ci.appveyor.com/api/buildjobs/$JOB/artifacts/$APPVEYOR_PROJECT_NAME.epf"
      - sh: |
          if [ -n "${APPVEYOR_API_URL:-}" ]; then
            PORT="${APPVEYOR_API_URL##*:}"
            PORT="${PORT%%/*}"
            printf '%s' "$PORT" > app_port.txt
            echo "app_port=$PORT"
          fi
      - sh: bash scripts/linux-1c-test.sh "$APPVEYOR_PROJECT_NAME.epf"

    on_failure:
      - sh: if [ -f prepare.log ]; then echo "=== prepare.log"; tail -n 100 prepare.log; fi
      - sh: if [ -f install.log ]; then echo "=== install.log"; tail -n 100 install.log; fi
      - sh: if [ -f autotest.log ]; then echo "=== autotest.log"; tail -n 200 autotest.log; fi
      - sh: if [ -f success.txt ]; then cat success.txt; fi

    artifacts:
      - path: prepare.log
      - path: install.log
      - path: autotest.log
      - path: success.txt
      - path: load.log
